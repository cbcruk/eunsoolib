name: Changeset Status

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  # changeset이 없어도 머지는 막지 않고, 어떤 패키지가 릴리스될지 PR에 댓글로 알린다.
  pr-status:
    # 포크 PR은 댓글 권한이 없어 건너뛰고, Version Packages PR은 changeset이 없으므로 건너뛴다.
    if: github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      comment-body: ${{ steps.pr-status.outputs.comment-body }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: pr-status
        uses: changesets/action/pr-status@v2

  pr-comment:
    needs: pr-status
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: changesets/action/pr-comment@v2
        with:
          body: ${{ needs.pr-status.outputs.comment-body }}
